name: Pinned Lakekeeper WASM threads experiment
on:
  push:
    branches: [experiment/wasm-threads-20261027]
    paths: ['scripts/wasm-threads-experiment/**']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      WASM_BUILD_JOBS: '4'
      CCACHE_DIR: ${{ github.workspace }}/.wasm-threads/ccache
      CCACHE_MAXSIZE: 2G
      CCACHE_COMPILERCHECK: content
      CCACHE_NOHASHDIR: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: '6.0.9'
          actions-cache-folder: emsdk-cache
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ccache pkg-config
          npm install --global js-beautify
      - uses: actions/cache/restore@v4
        id: dependencies
        with:
          path: .wasm-threads/build/extensions/vcpkg_installed
          key: lakekeeper-wasm-pthread-pic-dependencies-v1
      - uses: actions/cache/restore@v4
        with:
          path: .wasm-threads/ccache
          key: lakekeeper-wasm-ccache-v1-${{ github.run_id }}
          restore-keys: lakekeeper-wasm-ccache-v1-
      - name: Build pinned threaded extensions
        env:
          WASM_BUILD_PHASE: extensions
        run: python3 -u scripts/wasm-threads-experiment/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: lakekeeper-duckdb-2.0.0-threaded-extensions
          path: threaded-artifacts/extensions/
      - name: Build matching threaded runtime
        run: python3 -u scripts/wasm-threads-experiment/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: lakekeeper-duckdb-2.0.0-wasm-threads
          path: threaded-artifacts/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: wasm-threads-diagnostics
          path: |
            threaded-artifacts/**
            .wasm-threads/build/**/CMakeCache.txt
            .wasm-threads/build/**/CMakeConfigureLog.yaml
            .wasm-threads/sources/runtime/build/**/CMakeCache.txt
      - uses: actions/cache/save@v4
        if: always() && steps.dependencies.outputs.cache-hit != 'true'
        with:
          path: .wasm-threads/build/extensions/vcpkg_installed
          key: lakekeeper-wasm-pthread-pic-dependencies-v1
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .wasm-threads/ccache
          key: lakekeeper-wasm-ccache-v1-${{ github.run_id }}
